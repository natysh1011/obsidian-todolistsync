name: Release plugin

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, without a v prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify, attest, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Verify release version
        run: |
          node <<'NODE'
          const { readFileSync } = require("node:fs");
          const manifest = JSON.parse(readFileSync("manifest.json", "utf8"));
          const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
          const tag = process.env.RELEASE_TAG;
          if (!/^\d+\.\d+\.\d+$/.test(tag)) {
            throw new Error(`Release tag must be a version without a v prefix: ${tag}`);
          }
          if (manifest.version !== tag || packageJson.version !== tag) {
            throw new Error(
              `Tag ${tag}, manifest ${manifest.version}, and package ${packageJson.version} must match.`,
            );
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: |
          npm run locales:validate
          npm run lint
          npm run check
          npm test
          npm audit

      - name: Build
        run: npm run build

      - name: Verify committed build
        run: |
          test -s main.js
          test -s manifest.json
          test -s styles.css
          git diff --exit-code -- main.js

      - name: Package release
        run: zip -j "todoist-task-notes-${RELEASE_TAG}.zip" main.js manifest.json styles.css

      - name: Attest release assets
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
            todoist-task-notes-*.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="todoist-task-notes-${RELEASE_TAG}.zip"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              main.js manifest.json styles.css "$archive" --clobber
          else
            gh release create "$RELEASE_TAG" \
              main.js manifest.json styles.css "$archive" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
